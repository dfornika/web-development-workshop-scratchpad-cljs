<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Laboratory flask</title>
  <circle cx="32" cy="32" r="31" fill="#e6f0fa"/>
  <!-- liquid (clipped to the inside of the flask) -->
  <clipPath id="flask-inside">
    <path d="M27 12 h10 v13 l12 20 a4 4 0 0 1 -3.4 6 h-27.2 a4 4 0 0 1 -3.4 -6 l12 -20 z"/>
  </clipPath>
  <rect x="10" y="36" width="44" height="20" fill="#2da44e" clip-path="url(#flask-inside)"/>
  <path d="M10 36 q5.5 -3 11 0 t11 0 t11 0 t11 0 v3 h-44 z" fill="#4ac26b" clip-path="url(#flask-inside)"/>
  <!-- glass -->
  <path d="M27 12 h10 v13 l12 20 a4 4 0 0 1 -3.4 6 h-27.2 a4 4 0 0 1 -3.4 -6 l12 -20 z"
        fill="none" stroke="#004a87" stroke-width="3" stroke-linejoin="round"/>
  <line x1="24.5" y1="12" x2="39.5" y2="12" stroke="#004a87" stroke-width="3" stroke-linecap="round"/>
  <!-- bubbles -->
  <circle cx="29" cy="44" r="2" fill="#fff" opacity="0.85"/>
  <circle cx="35" cy="40.5" r="1.5" fill="#fff" opacity="0.85"/>
  <circle cx="38" cy="46" r="2.5" fill="#fff" opacity="0.85"/>
  <circle cx="33" cy="30" r="1.5" fill="#2da44e"/>
  <circle cx="30.5" cy="22" r="1.2" fill="#2da44e" opacity="0.7"/>
</svg>
